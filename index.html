function u(x){return Uint8Array.from(atob(x),function(ch){return ch.charCodeAt(0)})}
async function open_(raw){var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));var h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();}
async function derive(pw){var k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,256));}
